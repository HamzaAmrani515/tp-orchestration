global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "membership"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["membership:8081"]

  - job_name: "product"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["product:8082"]

  - job_name: "order"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["order:8083"]
